[project]
name = "chesslab"
version = "0.1.0"
description = "Tiny experiments in chess."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = "==3.12.*"
dependencies = [
    "chess>=1.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chesslab"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-local-folder = ["endgame"]
